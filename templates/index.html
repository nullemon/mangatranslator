<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MangaTranslator</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">
        <svg viewBox="0 0 32 32" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="26" height="26" rx="4"/>
          <path d="M8 10h6M8 15h4M18 10l3 5 3-5M18 20h6"/>
        </svg>
        <div>
          <h1>MangaTranslator</h1>
          <p class="subtitle">AI-powered manga page translation</p>
        </div>
      </div>
    </header>

    <div class="settings-bar">
      <div class="setting-group">
        <label for="apiKey">Claude API Key</label>
        <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">
      </div>
      <div class="setting-group">
        <label for="targetLang">Target Language</label>
        <select id="targetLang">
          <option value="English">English</option>
          <option value="Spanish">Spanish</option>
          <option value="French">French</option>
          <option value="German">German</option>
          <option value="Portuguese">Portuguese</option>
          <option value="Korean">Korean</option>
          <option value="Chinese">Chinese (Simplified)</option>
        </select>
      </div>
      <div class="setting-group">
        <label for="model">Model</label>
        <select id="model">
          <option value="claude-sonnet-4-6">Sonnet 4.6 (Fast)</option>
          <option value="claude-opus-4-6">Opus 4.6 (Best)</option>
          <option value="claude-haiku-4-5-20251001">Haiku 4.5 (Cheap)</option>
        </select>
      </div>
      <div class="setting-group">
        <label for="fontSelect">Font</label>
        <div class="font-row">
          <select id="fontSelect"><option value="">Auto-detect</option></select>
          <label class="btn-icon" title="Upload font (.ttf/.otf)">
            <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3v10M6 7l4-4 4 4"/><path d="M3 14v2a1 1 0 001 1h12a1 1 0 001-1v-2"/></svg>
            <input type="file" id="fontUpload" accept=".ttf,.otf" hidden>
          </label>
        </div>
      </div>
      <div class="setting-group toggle-group">
        <label for="smartMode">Smart Detection</label>
        <label class="toggle">
          <input type="checkbox" id="smartMode">
          <span class="toggle-slider"></span>
        </label>
        <span class="toggle-hint">Uses Claude Vision for detection. Drop Anime Ace .ttf into fonts/ or upload above.</span>
      </div>
    </div>

    <!-- UPLOAD -->
    <section id="uploadSection" class="section">
      <div class="drop-zone" id="dropZone">
        <svg viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="4" width="48" height="56" rx="6"/>
          <path d="M24 28l8-8 8 8M32 20v20"/>
        </svg>
        <p class="drop-title">Drop your manga page here</p>
        <p class="drop-sub">or click to browse &mdash; PNG, JPG, WebP</p>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>
      <div class="preview-row" id="previewRow" style="display:none">
        <img id="previewImg" alt="Preview">
        <div class="preview-info">
          <p id="fileName"></p>
          <p id="fileSize"></p>
          <button class="btn btn-primary" id="translateBtn">Translate</button>
          <button class="btn btn-ghost" id="clearBtn">Clear</button>
        </div>
      </div>
    </section>

    <!-- PROCESSING -->
    <section id="processingSection" class="section" style="display:none">
      <div class="steps">
        <div class="step" data-step="1"><span class="step-num">1</span><span class="step-label">Detect</span></div>
        <div class="step-line"></div>
        <div class="step" data-step="2"><span class="step-num">2</span><span class="step-label">Translate</span></div>
        <div class="step-line"></div>
        <div class="step" data-step="3"><span class="step-num">3</span><span class="step-label">Clean</span></div>
        <div class="step-line"></div>
        <div class="step" data-step="4"><span class="step-num">4</span><span class="step-label">Render</span></div>
        <div class="step-line"></div>
        <div class="step" data-step="5"><span class="step-num">5</span><span class="step-label">Done</span></div>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <p class="progress-msg" id="progressMsg">Starting...</p>
    </section>

    <!-- RESULT -->
    <section id="resultSection" class="section" style="display:none">
      <div class="result-tabs">
        <button class="tab active" data-tab="compare">Compare</button>
        <button class="tab" data-tab="original">Original</button>
        <button class="tab" data-tab="translated">Translated</button>
        <button class="tab" data-tab="details">Details</button>
      </div>

      <div class="tab-panel active" id="panel-compare">
        <div class="comparison" id="comparisonContainer">
          <img id="transImg" class="comp-img" alt="Translated">
          <div class="comp-overlay" id="compOverlay">
            <img id="origImg" class="comp-img" alt="Original">
          </div>
          <div class="comp-slider" id="compSlider">
            <div class="comp-handle">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M8 5l-5 7 5 7M16 5l5 7-5 7"/></svg>
            </div>
          </div>
          <span class="comp-label comp-label-left">Original</span>
          <span class="comp-label comp-label-right">Translated</span>
        </div>
      </div>

      <div class="tab-panel" id="panel-original">
        <img id="origFull" class="full-img" alt="Original">
      </div>

      <div class="tab-panel" id="panel-translated">
        <img id="transFull" class="full-img" alt="Translated">
      </div>

      <div class="tab-panel" id="panel-details">
        <div id="translationsList" class="translations-list"></div>
      </div>

      <div class="result-actions">
        <button class="btn btn-primary" id="downloadBtn">Download Translated</button>
        <button class="btn btn-ghost" id="newBtn">Translate Another</button>
      </div>
    </section>

    <!-- ERROR -->
    <section id="errorSection" class="section" style="display:none">
      <div class="error-box">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#f87171" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <p id="errorMsg">Something went wrong</p>
        <button class="btn btn-ghost" id="retryBtn">Try Again</button>
      </div>
    </section>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
